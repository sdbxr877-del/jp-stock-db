name: Tickers Master Update
on:
  schedule:
    - cron: '0 7 * * 1'   # UTC 07:00 Monday = JST 16:00 Monday (weekly)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry run mode (no BQ write)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
permissions:
  contents: read
  id-token: write
jobs:
  update-tickers:
    name: J-Quants Master to raw.tickers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/874756684682/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'jp-stock-db-sa@project-3eaadce9-f852-40e1-932.iam.gserviceaccount.com'
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check G1
        run: |
          set -euo pipefail
          python -m py_compile fetch_tickers.py
          echo G1 PASS
      - name: Secrets audit G2
        run: |
          set -euo pipefail
          hits=$(grep -cE 'print.*token|print.*key|print.*secret|print.*password' fetch_tickers.py || true)
          if [ "$hits" -gt 0 ]; then echo G2 FAIL; exit 1; fi
          echo G2 PASS
      - name: Run tickers update
        run: |
          set -euo pipefail
          ARGS=""
          DRY="${{ github.event.inputs.dry_run }}"
          if [ "$DRY" != "true" ]; then ARGS="--apply"; fi
          echo "running: python fetch_tickers.py $ARGS"
          python fetch_tickers.py $ARGS 2>&1 | tee tickers_update.log
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
      - name: Upload log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tickers-update-log-${{ github.run_id }}
          path: tickers_update.log
          retention-days: 30
